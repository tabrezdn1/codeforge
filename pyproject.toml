[tool.poetry]
name = "codeforge"
version = "0.1.0"
description = "A multi-agent system that transforms requirement documents into working code, built with Google ADK."
authors = ["Tabrez Shaik"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
google-adk = "^1.0.0"
google-cloud-aiplatform = { extras = ["adk"], version = "^1.55.0" }
google-cloud-storage = "^2.10.0"
pydantic = "^2.11.3"
python-dotenv = "^1.0.1"
pypdf = "^5.0.0"
httpx = "^0.27.0"
requests = "^2.31.0"
llama-index = "^0.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
